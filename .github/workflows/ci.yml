name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  dictionary-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deterministic dictionaries and exact accuracy
        run: |
          python3 -m unittest discover -s scripts/data/tests
          ./scripts/generate_data.sh
          python3 test/test_dictionary_accuracy.py
          git diff --exit-code -- sql/data

  rust-check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Run Rust checks
        run: |
          cargo fmt --check
          cargo check --lib --no-default-features --locked
          cargo check --bin benchmark_pinyin_regex_phrase --no-default-features --locked
          cargo test --lib --no-default-features --locked

  postgres-tests:
    name: PG${{ matrix.pg_major }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg_major: '15'
            base_image: postgres:15.20-trixie
            arch: amd64
            runner: ubuntu-24.04
          - pg_major: '15'
            base_image: postgres:15.20-trixie
            arch: arm64
            runner: ubuntu-24.04-arm
          - pg_major: '16'
            base_image: postgres:16.16-trixie
            arch: amd64
            runner: ubuntu-24.04
          - pg_major: '16'
            base_image: postgres:16.16-trixie
            arch: arm64
            runner: ubuntu-24.04-arm
          - pg_major: '17'
            base_image: postgres:17.12-trixie
            arch: amd64
            runner: ubuntu-24.04
          - pg_major: '17'
            base_image: postgres:17.12-trixie
            arch: arm64
            runner: ubuntu-24.04-arm
          - pg_major: '18'
            base_image: postgres:18.7-trixie
            arch: amd64
            runner: ubuntu-24.04
          - pg_major: '18'
            base_image: postgres:18.7-trixie
            arch: arm64
            runner: ubuntu-24.04-arm
          - pg_major: '19'
            base_image: postgres:18.7-trixie
            arch: amd64
            runner: ubuntu-24.04
          - pg_major: '19'
            base_image: postgres:18.7-trixie
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build test image
        run: |
          build_args=(--build-arg 'BASE_IMAGE=${{ matrix.base_image }}')
          if [[ '${{ matrix.pg_major }}' == '18' ]]; then
            dockerfile=docker/Dockerfile.test-trixie
          else
            dockerfile=docker/Dockerfile.test-core-trixie
            build_args+=(--build-arg 'TARGET_PG_MAJOR=${{ matrix.pg_major }}')
          fi
          docker build "${build_args[@]}" -f "$dockerfile" -t pg-pinyin-test:ci .

      - name: Start test container
        run: |
          postgres_args=()
          if [[ '${{ matrix.pg_major }}' == '18' ]]; then
            postgres_args=(-c shared_preload_libraries=pg_search)
          fi
          docker run -d --name pg-pinyin-test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=postgres \
            -v "$GITHUB_WORKSPACE:/work" \
            pg-pinyin-test:ci postgres "${postgres_args[@]}"

      - name: Run native tests, release install, upgrade and pgTAP checks
        run: |
          docker exec -i -u root pg-pinyin-test bash -s <<'BASH'
          set -euo pipefail
          for attempt in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
          cd /work
          git config --global --add safe.directory /work
          export PG_CONFIG="/usr/lib/postgresql/${PG_MAJOR}/bin/pg_config"
          export PGURL=postgres://postgres@127.0.0.1:5432/postgres
          "$PG_CONFIG" --version
          rustc --version
          cargo pgrx --version
          psql "$PGURL" -Atc 'SELECT version()'
          cargo pgrx init "--pg${PG_MAJOR}=$PG_CONFIG"
          cargo pgrx test "pg${PG_MAJOR}" --release --features pg_test --no-default-features \
            --runas postgres --pgdata /tmp/pg-pinyin-tests
          if [[ "$PG_MAJOR" == '18' ]]; then
            PG_PINYIN_BUILD_RELEASE=1 bash test/prepare_upgrade.sh
          fi
          cargo pgrx install -v --release --features "pg${PG_MAJOR}" --no-default-features --pg-config "$PG_CONFIG"
          cp pg_pinyin--*--*.sql "$("$PG_CONFIG" --sharedir)/extension/"
          if [[ "$PG_MAJOR" == '18' ]]; then
            psql "$PGURL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_search CASCADE;'
            test "$(psql "$PGURL" -Atc "SELECT extversion FROM pg_extension WHERE extname='pg_search'")" = 0.26.1
            PG_LOADER_TESTS=1 TEST_UPGRADE_DSN="$PGURL" python3 -m unittest discover -s test -p 'test_*.py'
          fi
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_pinyin;'
          if [[ "$PG_MAJOR" == '18' ]]; then
            ./test/pgtap/run.sh
          else
            pg_prove --dbname "$PGURL" test/pgtap/02_pg_pinyin_extension.sql test/pgtap/04_parallel_read_only.sql
          fi
          BASH

      - name: Consume dynamic conversion and parser benchmark outputs
        run: |
          docker exec -i pg-pinyin-test psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TEMP TABLE benchmark_probe AS
          SELECT n, '郑爽ABC'::text AS value, 'whh'::text AS query FROM generate_series(1,20000) n;
          EXPLAIN (ANALYZE, BUFFERS)
          SELECT sum(octet_length(public.pinyin_word_romanize(value))) FROM benchmark_probe;
          EXPLAIN (ANALYZE, BUFFERS)
          SELECT sum(cardinality(public.pinyin_regex_phrase_patterns(query))) FROM benchmark_probe;
          SQL

      - name: Container logs
        if: always()
        run: docker logs pg-pinyin-test || true

      - name: Cleanup container
        if: always()
        run: docker rm -fv pg-pinyin-test || true
